name: CI / CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI — Validate & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zebabu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zebabu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zebabu_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint:check

      - name: Write .env for typecheck
        run: cp apps/web/.env.example apps/web/.env

      - name: Paraglide compile
        run: cd apps/web && bunx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Typecheck
        run: bun run typecheck

      - name: Migrate test database
        run: bun run db:migrate

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zebabu-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: migration
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zebabu-web:migration-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrate and deploy
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_CONFIG_API_TOKEN: ${{ secrets.COOLIFY_CONFIG_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_MIGRATION_APP_UUID: ${{ secrets.COOLIFY_MIGRATION_APP_UUID }}
        run: bash scripts/deploy-coolify.sh
